[package]
name = "floe"
version = "0.1.0"
edition = "2024"
description = "Install and update flatpak bundles straight from GitHub releases, using the GitHub CLI"
license = "MIT"

[dependencies]
# Same pin as PenguinFin / rust-ui: 0.7.10 has no matching dioxus-desktop release.
dioxus = { version = "=0.7.9", default-features = false, features = ["desktop", "launch", "macro", "html", "signals", "hooks", "document"] }
tw_merge = { version = "0.1" }
strum = { version = "0.28", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the webview; keeps native popups (dropdown lists) on the app theme.
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
